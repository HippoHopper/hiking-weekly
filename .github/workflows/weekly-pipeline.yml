name: weekly-pipeline

# 每周一 UTC 12:00（北京时间周一 20:00）发布下周周末的三条轮换路线并部署；也支持网页手动触发
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

jobs:
  rotate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Rotate weekly routes from local track library
        # 纯离线：只读仓库内 track-library.json/destinations.json/published.json，
        # 不访问两步路（数据中心 IP 过不了 WAF）；库存由本机每日 discover 攒好后提交入库。
        # open-meteo 天气实时参与打分；库存为空时脚本不改动 routes.json，部署自然保留上周内容。
        run: node scripts/fetch-routes.js --rotate --write --fares
        # 机票快照为 best-effort：Google Flights 抓取失败保留 fares.json 旧快照，不阻断发布

      - name: Commit rotation snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add src/data/routes.json src/data/fares.json scripts/published.json scripts/track-library.json public/photos
          if git diff --cached --quiet; then
            echo "本周无数据变更，跳过提交"
          else
            git commit -m "chore: 每周轮换选品快照（$(date -u +%Y-%m-%d)）"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Build and deploy to GitHub Pages
        run: npm run deploy
        # predeploy 自动执行 npm run build；gh-pages 复用上方配置了 token 的 origin 推送 gh-pages 分支
